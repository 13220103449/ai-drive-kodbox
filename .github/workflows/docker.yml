name: Build Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-drive-kodbox
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
          labels: |
            org.opencontainers.image.title=AI Drive
            org.opencontainers.image.description=Human and Agent collaborative file platform based on KodBox
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish AMD64 and ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and verify the real application page
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            image_tag="${GITHUB_REF_NAME#v}"
          else
            image_tag="edge"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/ai-drive-kodbox:${image_tag}"
          docker run -d --name ai-drive-smoke -p 127.0.0.1:18091:80 "$image"
          trap 'docker logs ai-drive-smoke || true; docker rm -f ai-drive-smoke >/dev/null 2>&1 || true' EXIT
          docker exec ai-drive-smoke php -r '
            foreach (["curl", "gd", "mbstring", "mysqli", "pdo_sqlite", "xml", "zip", "zlib"] as $extension) {
                if (!extension_loaded($extension)) {
                    fwrite(STDERR, "Missing PHP extension: $extension\n");
                    exit(1);
                }
            }
          '
          for attempt in {1..30}; do
            page_size="$(curl -fsS http://127.0.0.1:18091/ 2>/dev/null | wc -c || true)"
            if [[ "${page_size:-0}" -gt 1000 ]]; then
              echo "AI Drive returned a valid application page (${page_size} bytes)."
              exit 0
            fi
            sleep 2
          done
          echo "AI Drive did not return a valid page in time." >&2
          exit 1
